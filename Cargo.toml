[workspace]
resolver = "3"
members = ["crates/sketcraft-core", "crates/sketcraft-ui"]
default-members = ["crates/sketcraft-ui"]

[workspace.package]
version = "0.40.0-rc.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
authors = ["SketCraft contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
glam = { version = "0.30", features = ["serde"] }

# Keep the development UI responsive without disabling debugger symbols,
# debug assertions, or overflow checks. Optimize third-party rendering/UI code
# and the geometry core more heavily than frequently edited application code.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.sketcraft-core]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = "line-tables-only"
