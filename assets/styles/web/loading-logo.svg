<svg xmlns="http://www.w3.org/2000/svg" viewBox="56 24 912 1060" width="456" height="530" role="img" aria-labelledby="t d">
  <title id="t">SketCraft</title>
  <desc id="d">A square is drawn on a grid and pulled up into a slab. A smaller square is drawn on the slab's top and pulled up into a block. The lines fade and the gaps between faces appear, leaving the SketCraft logo.</desc>
  <defs>
    <linearGradient id="f1" x1="398.928" y1="522.551" x2="625.072" y2="833.374" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#459fff"/><stop offset="1" stop-color="#2379e7"/></linearGradient>
