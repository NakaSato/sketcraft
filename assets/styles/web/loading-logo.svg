  <style>
    :root { --grid: #507eaa; --word: #15499e; --line: #0b2f66; --tool: #ff6a3d; }
    .grid { stroke: var(--grid); stroke-width: 3; fill: none; opacity: .32; }
    .word { font: 700 64px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--word); letter-spacing: .02em; }
    .stk { fill: none; stroke: var(--line); stroke-width: 14; stroke-linejoin: round; }
    .ptop { fill: var(--tool); fill-opacity: .38; stroke: var(--tool); stroke-width: 16; stroke-linejoin: round; }
    /* base styles are the finished logo (gaps, no lines), so reduced motion shows it whole */
    .slab, .block, .tl { opacity: 0; }
    .all   { animation: all 5.4s linear infinite; }
    .gridg { animation: gridin 5.4s ease-out infinite; }
    .slab  { animation: slab 5.4s linear infinite; }
    .block { animation: block 5.4s linear infinite; }
    .tS    { animation: tS 5.4s ease-in-out infinite; }
    .tB    { animation: tB 5.4s ease-in-out infinite; }
    .fin   { animation: fin 5.4s ease-in-out infinite; }
    @keyframes all    { 0% { opacity: 0; } 2%, 96% { opacity: 1; } 99.5%, 100% { opacity: 0; } }
    @keyframes gridin { 0% { opacity: 0; } 7%, 100% { opacity: 1; } }
    /* the footprint is drawn, then pulled up; the tool face rides on top of the pull */
    @keyframes tS    { 0%, 5% { opacity: 0; } 9%, 27% { opacity: 1; } 31%, 100% { opacity: 0; } }
    @keyframes tB    { 0%, 29% { opacity: 0; } 33%, 49% { opacity: 1; } 53%, 100% { opacity: 0; } }
    @keyframes slab  { 0%, 13% { opacity: 0; } 14.5%, 54% { opacity: 1; } 60%, 100% { opacity: 0; } }
    @keyframes block { 0%, 35% { opacity: 0; } 36.5%, 54% { opacity: 1; } 60%, 100% { opacity: 0; } }
    @keyframes fin   { 0%, 54% { opacity: 0; } 60%, 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .all, .gridg, .slab, .block, .tS, .tB, .fin { animation: none; } }
  </style>
