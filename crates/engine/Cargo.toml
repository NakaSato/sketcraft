[package]
name = "sketcraft-engine"
description = "SketCraft engine: the session, the command registry (everything is a command), undo/redo and selection"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
# Optional authored texture/HDR bytes; the command registry and metadata remain available.
bundled-render-library = []
raytrace-cpu = ["sketcraft-render/raytrace-cpu"]
# Turns on the parameter-contract audit recorder (`SKETCRAFT_PARAM_AUDIT`, see
# `src/schema/record.rs`), for checking a new contract against the whole test suite.
param-audit = []
solver-profiling = ["sketcraft-sketch/solver-profiling"]
# Compile the profiler in (sketcraft-profile/enabled): every app turns it on by default, so any
# build can be profiled; it records only once switched on (SKETCRAFT_PROFILE=1, the CLI's
# --profile, the app's preference, diagnostics.profile).
profile = ["sketcraft-profile/enabled"]

[[example]]
name = "sketch_analysis_bench"
required-features = ["solver-profiling"]

[[example]]
name = "sketch_drag_bench"
required-features = ["solver-profiling"]

[[example]]
name = "sketch_target_bench"
required-features = ["solver-profiling"]

[dependencies]
sketcore-record = { workspace = true }
sketcraft-geom = { workspace = true }
sketcraft-sketch = { workspace = true }
sketcraft-kernel = { workspace = true }
sketcraft-doc = { workspace = true }
sketcraft-io = { workspace = true }
sketcraft-render = { workspace = true }
sketcraft-profile = { workspace = true }
# reference pictures for inspect.compare_picture (PNG and JPEG decode, PNG encode)
image = { workspace = true, features = ["jpeg"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml_edit = "0.25"
schemars = { workspace = true }
serde_path_to_error = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
web-time = { workspace = true }

[dev-dependencies]
sketcraft-profile = { workspace = true, features = ["enabled"] }
# Model-cache tests also run in a source tarball build (no git commit).
sketcraft-io = { workspace = true, features = ["trust-unknown-source"] }
# Normal CI exercises profiling assertions without enabling the production feature.
sketcraft-sketch = { workspace = true, features = ["solver-profiling"] }

[[example]]
name = "render_resource_workflow"
required-features = ["raytrace-cpu"]

[[example]]
name = "wood_texture_workflow"
required-features = ["raytrace-cpu"]
