[package]
name = "sketcraft-smlib"
description = "SketCraft: the B-rep kernel, sketcore (the Rust port of NVIDIA's SMLib, Apache-2.0), behind a safe wrapper"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
sketcore-record = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }
sketcraft-geom = { workspace = true }
sketcraft-profile = { workspace = true }
sketcore = { workspace = true }

[dev-dependencies]
sketcraft-profile = { workspace = true, features = ["enabled"] }
flate2 = "1.1"
