[package]
name = "sketcraft-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "sketcraft_ui"
path = "src/lib.rs"

[[bin]]
name = "sketcraft"
path = "src/main.rs"

[dependencies]
sketcraft-core = { path = "../sketcraft-core" }
serde.workspace = true
serde_json.workspace = true
skrifa = "0.44"
glam.workspace = true
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland", "accesskit", "persistence", "links"] }
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# Deflate reading for 3MF packages (flate2 with its pure-Rust backend).
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
# 3MF model XML and glTF 2.0 documents; buffers are read here, so no file access or images.
quick-xml = "0.41"
gltf = { version = "1.4", default-features = false, features = ["utils", "names"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30", features = ["webgpu", "webgl"] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Storage", "Blob", "BlobPropertyBag", "HtmlAnchorElement", "Url", "HtmlInputElement", "File", "FileList", "Event", "EventTarget"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
directories = "6"
tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ureq = "3.5"
tempfile = "3"
# Keep this in sync with the vpk tool in the desktop release workflow.
velopack = "=1.2.161"
rayon = "1.12"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
pollster = "0.4"
png = "0.18"

[build-dependencies]
cc = "1"
