[package]
name = "sketcraft-cli"
description = "SketCraft headless CLI: run command scripts, measure, export, render snapshots, replay oracle recipes"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "sketcraft-cli"

[lints]
workspace = true

[[bin]]
name = "sketcraft-cli"
path = "src/main.rs"

# Compatibility alias for the CLI's former name: forwards to sketcraft-cli with a deprecation
# note on stderr. Shipped in every package for at least one release.
[[bin]]
name = "solvecraft-cli"
path = "src/alias.rs"

[features]
default = ["raytrace-cpu", "profile"]
bundled-render-library = ["sketcraft-engine/bundled-render-library"]
raytrace-cpu = ["sketcraft-engine/raytrace-cpu"]
# The profiler, compiled in so any build can say where its time goes (`--profile`,
# SKETCRAFT_PROFILE=1); it records nothing until asked.
profile = ["sketcraft-engine/profile"]

[dependencies]
sketcore-record = { workspace = true }
sketcraft-engine = { workspace = true }
sketcraft-gpu = { workspace = true }
sketcraft-mcp = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Snapshot tests decode the pictures to compare them with a tolerance.
image = { workspace = true }
# Tests measure meshes at their own tolerances.
sketcraft-kernel = { workspace = true }
